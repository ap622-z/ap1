services:
  mysql:
    image: mysql:8.0
    container_name: ap1-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ap1
      MYSQL_USER: ap1
      MYSQL_PASSWORD: ap1
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ap1_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uap1", "-pap1"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ap1-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ap1_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ap1-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ap1_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: backend
    container_name: ap1-app
    environment:
      ENV: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ap1
      MYSQL_PASSWORD: ap1
      MYSQL_DB: ap1
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # 模型/搜索/嵌入密钥由宿主 .env 或环境注入；未配则启动校验阻止并给出指引
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-ds-v4-flash}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.tavily.com}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_MAX_INPUT_CHARS: ${EMBED_MAX_INPUT_CHARS:-6000}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      WINDOW_TOKEN_BUDGET: ${WINDOW_TOKEN_BUDGET:-6000}
      KEEP_RECENT_TURNS: "10"
      MAX_RUN_STEPS: "8"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  nginx:
    build:
      context: .
      target: web
    container_name: ap1-nginx
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ap1_mysql_data:
  ap1_qdrant_data:
  ap1_redis_data:
