[project]
name = "ap1"
version = "0.1.0"
description = "偶像 Agent 情感陪伴系统 — 单例零用户状态 Agent + 多用户数据隔离"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyMySQL>=1.1",
    "cryptography>=42.0",
    "qdrant-client>=1.9",
    "redis>=5.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "aiomysql>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
